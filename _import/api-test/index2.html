<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTML Canvas로 만든 테트리스 게임">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🟪%3C/text%3E%3C/svg%3E">
    <title>NEON BLOCKS · Tetris</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #080a12;
            --panel: rgba(18, 22, 38, 0.88);
            --panel-strong: #111525;
            --line: rgba(255, 255, 255, 0.09);
            --text: #f7f8ff;
            --muted: #939bb4;
            --violet: #8b5cf6;
            --cyan: #22d3ee;
            --green: #34d399;
            --shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 18% 12%, rgba(34, 211, 238, 0.1), transparent 30%),
                radial-gradient(circle at 85% 78%, rgba(139, 92, 246, 0.14), transparent 34%),
                linear-gradient(145deg, #090b14 0%, #06070c 100%);
            color: var(--text);
            font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont,
                "Segoe UI", "Noto Sans KR", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
        }

        .ambient-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.24;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: linear-gradient(to bottom, black, transparent 88%);
            pointer-events: none;
        }

        .app {
            width: min(960px, calc(100% - 32px));
            margin: 0 auto;
            padding: 30px 0 48px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(139, 92, 246, 0.5);
            border-radius: 11px;
            background: linear-gradient(145deg, #9d70ff, #5b3dc4);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
            font-size: 17px;
            font-weight: 900;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.03em;
        }

        .brand-subtitle {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
        }

        .back-link {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--text);
        }

        .game-shell {
            display: grid;
            grid-template-columns: 188px 300px 188px;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: rgba(12, 15, 27, 0.72);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-card {
            border: 1px solid var(--line);
            border-radius: 15px;
            background: var(--panel);
        }

        .stat-card {
            padding: 16px;
        }

        .stat-label,
        .panel-label {
            display: block;
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .stat-value {
            display: block;
            margin-top: 6px;
            font-variant-numeric: tabular-nums;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .stat-accent {
            color: var(--cyan);
            text-shadow: 0 0 18px rgba(34, 211, 238, 0.25);
        }

        .board-wrap {
            position: relative;
            width: 300px;
            height: 600px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 10px;
            background: #090c16;
            box-shadow:
                0 0 0 5px rgba(255, 255, 255, 0.025),
                0 20px 46px rgba(0, 0, 0, 0.42),
                0 0 38px rgba(34, 211, 238, 0.07);
        }

        #game-canvas {
            width: 300px;
            height: 600px;
            display: block;
        }

        .game-overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 26px;
            opacity: 0;
            visibility: hidden;
            background: rgba(5, 7, 13, 0.82);
            backdrop-filter: blur(6px);
            transition: opacity 180ms ease, visibility 180ms ease;
        }

        .game-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .overlay-content {
            text-align: center;
        }

        .overlay-kicker {
            color: var(--cyan);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .overlay-title {
            margin: 9px 0 7px;
            font-size: 30px;
            letter-spacing: -0.05em;
        }

        .overlay-description {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .primary-button,
        .secondary-button {
            width: 100%;
            border: 0;
            border-radius: 11px;
            padding: 12px 14px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 850;
            transition: transform 120ms ease, filter 120ms ease;
        }

        .primary-button {
            color: #fff;
            background: linear-gradient(135deg, #8b5cf6, #6842cf);
            box-shadow: 0 8px 22px rgba(139, 92, 246, 0.24);
        }

        .secondary-button {
            color: var(--text);
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.055);
        }

        .primary-button:hover,
        .secondary-button:hover {
            filter: brightness(1.12);
        }

        .primary-button:active,
        .secondary-button:active {
            transform: translateY(1px);
        }

        .next-card {
            padding: 15px;
        }

        #next-canvas {
            width: 120px;
            height: 104px;
            display: block;
            margin: 9px auto 0;
        }

        .controls-card {
            padding: 15px;
        }

        .key-list {
            display: grid;
            gap: 9px;
            margin-top: 14px;
        }

        .key-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--muted);
            font-size: 10px;
            font-weight: 650;
        }

        kbd {
            min-width: 27px;
            padding: 5px 7px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-bottom-width: 2px;
            border-radius: 6px;
            color: #dfe4f3;
            background: rgba(255, 255, 255, 0.06);
            font-family: inherit;
            font-size: 9px;
            font-weight: 800;
            text-align: center;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 12px 14px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 750;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.55);
        }

        .status.paused .status-dot {
            background: var(--orange);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
        }

        .status.over .status-dot {
            background: #f43f5e;
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.45);
        }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 16px;
        }

        .mobile-control {
            min-height: 50px;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            background: var(--panel);
            cursor: pointer;
            font-size: 17px;
            font-weight: 900;
            touch-action: manipulation;
        }

        .mobile-control:active {
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.1);
        }

        .help-text {
            margin: 16px 0 0;
            color: #6f7890;
            font-size: 10px;
            line-height: 1.6;
            text-align: center;
        }

        @media (max-width: 760px) {
            .app {
                width: min(100% - 20px, 560px);
                padding-top: 18px;
            }

            .game-shell {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                padding: 14px;
            }

            .board-wrap {
                grid-column: 1 / -1;
                grid-row: 1;
                justify-self: center;
            }

            .side-panel.left,
            .side-panel.right {
                grid-row: 2;
            }

            .controls-card {
                display: none;
            }

            .mobile-controls {
                display: grid;
            }
        }

        @media (max-width: 380px) {
            .game-shell {
                margin-inline: -4px;
                padding-inline: 8px;
            }

            .board-wrap,
            #game-canvas {
                width: 280px;
            }

            .board-wrap {
                height: 560px;
            }

            #game-canvas {
                height: 560px;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-grid" aria-hidden="true"></div>

    <main class="app">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">N</span>
                <div>
                    <span class="brand-name">NEON BLOCKS</span>
                    <span class="brand-subtitle">CANVAS TETRIS</span>
                </div>
            </div>
            <a class="back-link" href="/">← 대시보드</a>
        </header>

        <section class="game-shell" aria-label="테트리스 게임">
            <aside class="side-panel left">
                <div class="panel-card stat-card">
                    <span class="stat-label">Score</span>
                    <strong class="stat-value stat-accent" id="score">0</strong>
                </div>
                <div class="panel-card stat-card">
                    <span class="stat-label">Lines</span>
                    <strong class="stat-value" id="lines">0</strong>
                </div>
                <div class="panel-card stat-card">
                    <span class="stat-label">Level</span>
                    <strong class="stat-value" id="level">1</strong>
                </div>
                <div class="panel-card status" id="status" role="status" aria-live="polite">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="status-text">플레이 중</span>
                </div>
            </aside>

            <div class="board-wrap">
                <canvas id="game-canvas" aria-label="테트리스 플레이 영역">
                    브라우저가 Canvas를 지원하지 않습니다.
                </canvas>
                <div class="game-overlay" id="game-overlay">
                    <div class="overlay-content">
                        <span class="overlay-kicker" id="overlay-kicker">Game paused</span>
                        <h1 class="overlay-title" id="overlay-title">일시정지</h1>
                        <p class="overlay-description" id="overlay-description">
                            준비되면 게임을 계속하세요.
                        </p>
                        <button class="primary-button" id="overlay-button" type="button">
                            계속하기
                        </button>
                    </div>
                </div>
            </div>

            <aside class="side-panel right">
                <div class="panel-card next-card">
                    <span class="panel-label">Next block</span>
                    <canvas id="next-canvas" aria-label="다음 블록 미리보기"></canvas>
                </div>

                <button class="primary-button" id="restart-button" type="button">
                    새 게임
                </button>
                <button class="secondary-button" id="pause-button" type="button">
                    일시정지
                </button>

                <div class="panel-card controls-card">
                    <span class="panel-label">Keyboard</span>
                    <div class="key-list">
                        <div class="key-row"><span>이동</span><span><kbd>←</kbd> <kbd>→</kbd></span></div>
                        <div class="key-row"><span>회전</span><kbd>↑</kbd></div>
                        <div class="key-row"><span>소프트 드롭</span><kbd>↓</kbd></div>
                        <div class="key-row"><span>하드 드롭</span><kbd>Space</kbd></div>
                        <div class="key-row"><span>일시정지</span><kbd>P</kbd></div>
                    </div>
                </div>
            </aside>
        </section>

        <nav class="mobile-controls" aria-label="모바일 게임 조작">
            <button class="mobile-control" type="button" data-action="left" aria-label="왼쪽 이동">←</button>
            <button class="mobile-control" type="button" data-action="rotate" aria-label="회전">↻</button>
            <button class="mobile-control" type="button" data-action="down" aria-label="아래 이동">↓</button>
            <button class="mobile-control" type="button" data-action="right" aria-label="오른쪽 이동">→</button>
            <button class="mobile-control" type="button" data-action="drop" aria-label="하드 드롭">⇊</button>
        </nav>

        <p class="help-text">
            같은 색 블록을 맞출 필요 없이 가로 한 줄을 빈틈없이 채우면 제거됩니다.
        </p>
    </main>

    <script>
        // 게임 보드와 블록의 기본 규격입니다.
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        const SCORE_TABLE = [0, 100, 300, 500, 800];

        const PIECES = {
            I: {
                color: "#22d3ee",
                shape: [[1, 1, 1, 1]]
            },
            J: {
                color: "#3b82f6",
                shape: [[1, 0, 0], [1, 1, 1]]
            },
            L: {
                color: "#fb923c",
                shape: [[0, 0, 1], [1, 1, 1]]
            },
            O: {
                color: "#facc15",
                shape: [[1, 1], [1, 1]]
            },
            S: {
                color: "#34d399",
                shape: [[0, 1, 1], [1, 1, 0]]
            },
            T: {
                color: "#a78bfa",
                shape: [[0, 1, 0], [1, 1, 1]]
            },
            Z: {
                color: "#fb7185",
                shape: [[1, 1, 0], [0, 1, 1]]
            }
        };

        const canvas = document.querySelector("#game-canvas");
        const context = canvas.getContext("2d");
        const nextCanvas = document.querySelector("#next-canvas");
        const nextContext = nextCanvas.getContext("2d");

        let board;
        let activePiece;
        let nextType;
        let pieceBag = [];
        let score;
        let lines;
        let level;
        let dropInterval;
        let dropCounter;
        let previousTime;
        let paused;
        let gameOver;
        let animationId;

        // 고해상도 화면에서도 Canvas가 선명하게 보이도록 픽셀 비율을 맞춥니다.
        function setupCanvas(target, targetContext, width, height) {
            const ratio = window.devicePixelRatio || 1;
            target.width = width * ratio;
            target.height = height * ratio;
            targetContext.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        setupCanvas(canvas, context, COLS * BLOCK_SIZE, ROWS * BLOCK_SIZE);
        setupCanvas(nextCanvas, nextContext, 120, 104);

        // 7종 블록을 한 번씩 섞어 사용하는 bag 방식으로 다음 블록을 선택합니다.
        function takeFromBag() {
            if (pieceBag.length === 0) {
                pieceBag = Object.keys(PIECES);
                for (let index = pieceBag.length - 1; index > 0; index -= 1) {
                    const randomIndex = Math.floor(Math.random() * (index + 1));
                    [pieceBag[index], pieceBag[randomIndex]] =
                        [pieceBag[randomIndex], pieceBag[index]];
                }
            }
            return pieceBag.pop();
        }

        function cloneMatrix(matrix) {
            return matrix.map((row) => [...row]);
        }

        function createPiece(type) {
            const matrix = cloneMatrix(PIECES[type].shape);
            return {
                type,
                matrix,
                row: 0,
                col: Math.floor((COLS - matrix[0].length) / 2)
            };
        }

        function spawnPiece() {
            activePiece = createPiece(nextType || takeFromBag());
            nextType = takeFromBag();
            drawNextPiece();

            if (hasCollision(activePiece, 0, 0, activePiece.matrix)) {
                endGame();
            }
        }

        // 이동하거나 회전한 블록이 벽·바닥·쌓인 블록과 겹치는지 검사합니다.
        function hasCollision(piece, rowOffset, colOffset, matrix) {
            for (let row = 0; row < matrix.length; row += 1) {
                for (let col = 0; col < matrix[row].length; col += 1) {
                    if (!matrix[row][col]) {
                        continue;
                    }

                    const boardRow = piece.row + row + rowOffset;
                    const boardCol = piece.col + col + colOffset;

                    if (
                        boardCol < 0 ||
                        boardCol >= COLS ||
                        boardRow >= ROWS ||
                        (boardRow >= 0 && board[boardRow][boardCol])
                    ) {
                        return true;
                    }
                }
            }
            return false;
        }

        function movePiece(colOffset) {
            if (paused || gameOver) {
                return;
            }
            if (!hasCollision(activePiece, 0, colOffset, activePiece.matrix)) {
                activePiece.col += colOffset;
                draw();
            }
        }

        function softDrop(manual = true) {
            if (paused || gameOver) {
                return;
            }

            if (!hasCollision(activePiece, 1, 0, activePiece.matrix)) {
                activePiece.row += 1;
                if (manual) {
                    score += 1;
                    updateStats();
                }
            } else {
                lockPiece();
            }
            dropCounter = 0;
            draw();
        }

        function hardDrop() {
            if (paused || gameOver) {
                return;
            }

            let distance = 0;
            while (!hasCollision(activePiece, 1, 0, activePiece.matrix)) {
                activePiece.row += 1;
                distance += 1;
            }
            score += distance * 2;
            lockPiece();
            dropCounter = 0;
            draw();
        }

        function rotatePiece() {
            if (paused || gameOver) {
                return;
            }

            const rotated = activePiece.matrix[0].map((_, column) =>
                activePiece.matrix.map((row) => row[column]).reverse()
            );

            for (const kick of [0, -1, 1, -2, 2]) {
                if (!hasCollision(activePiece, 0, kick, rotated)) {
                    activePiece.matrix = rotated;
                    activePiece.col += kick;
                    draw();
                    return;
                }
            }
        }

        // 바닥에 닿은 블록을 보드에 합치고 완성된 줄을 제거합니다.
        function lockPiece() {
            activePiece.matrix.forEach((row, rowIndex) => {
                row.forEach((value, colIndex) => {
                    if (value) {
                        const boardRow = activePiece.row + rowIndex;
                        if (boardRow >= 0) {
                            board[boardRow][activePiece.col + colIndex] =
                                activePiece.type;
                        }
                    }
                });
            });

            clearCompletedLines();
            spawnPiece();
            updateStats();
        }

        function clearCompletedLines() {
            let cleared = 0;

            for (let row = ROWS - 1; row >= 0; row -= 1) {
                if (board[row].every(Boolean)) {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(null));
                    cleared += 1;
                    row += 1;
                }
            }

            if (cleared > 0) {
                score += SCORE_TABLE[cleared] * level;
                lines += cleared;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(90, 850 - (level - 1) * 65);
            }
        }

        // 현재 블록 아래의 착지 예상 위치를 계산해 고스트 블록으로 표시합니다.
        function getGhostRow() {
            let offset = 0;
            while (!hasCollision(activePiece, offset + 1, 0, activePiece.matrix)) {
                offset += 1;
            }
            return activePiece.row + offset;
        }

        function drawCell(targetContext, col, row, color, size, alpha = 1) {
            const x = col * size;
            const y = row * size;

            targetContext.save();
            targetContext.globalAlpha = alpha;
            targetContext.fillStyle = color;
            targetContext.shadowColor = color;
            targetContext.shadowBlur = alpha === 1 ? 10 : 0;
            targetContext.fillRect(x + 2, y + 2, size - 4, size - 4);
            targetContext.shadowBlur = 0;
            targetContext.fillStyle = "rgba(255,255,255,0.22)";
            targetContext.fillRect(x + 4, y + 4, size - 8, 2);
            targetContext.strokeStyle = "rgba(255,255,255,0.14)";
            targetContext.strokeRect(x + 2.5, y + 2.5, size - 5, size - 5);
            targetContext.restore();
        }

        function drawMatrix(matrix, offsetCol, offsetRow, type, alpha = 1) {
            matrix.forEach((row, rowIndex) => {
                row.forEach((value, colIndex) => {
                    if (value && offsetRow + rowIndex >= 0) {
                        drawCell(
                            context,
                            offsetCol + colIndex,
                            offsetRow + rowIndex,
                            PIECES[type].color,
                            BLOCK_SIZE,
                            alpha
                        );
                    }
                });
            });
        }

        function drawBoardBackground() {
            context.fillStyle = "#090c16";
            context.fillRect(0, 0, COLS * BLOCK_SIZE, ROWS * BLOCK_SIZE);
            context.strokeStyle = "rgba(255,255,255,0.035)";
            context.lineWidth = 1;

            for (let col = 1; col < COLS; col += 1) {
                context.beginPath();
                context.moveTo(col * BLOCK_SIZE + 0.5, 0);
                context.lineTo(col * BLOCK_SIZE + 0.5, ROWS * BLOCK_SIZE);
                context.stroke();
            }
            for (let row = 1; row < ROWS; row += 1) {
                context.beginPath();
                context.moveTo(0, row * BLOCK_SIZE + 0.5);
                context.lineTo(COLS * BLOCK_SIZE, row * BLOCK_SIZE + 0.5);
                context.stroke();
            }
        }

        function draw() {
            drawBoardBackground();

            board.forEach((row, rowIndex) => {
                row.forEach((type, colIndex) => {
                    if (type) {
                        drawCell(
                            context,
                            colIndex,
                            rowIndex,
                            PIECES[type].color,
                            BLOCK_SIZE
                        );
                    }
                });
            });

            if (activePiece && !gameOver) {
                drawMatrix(
                    activePiece.matrix,
                    activePiece.col,
                    getGhostRow(),
                    activePiece.type,
                    0.18
                );
                drawMatrix(
                    activePiece.matrix,
                    activePiece.col,
                    activePiece.row,
                    activePiece.type
                );
            }
        }

        function drawNextPiece() {
            nextContext.clearRect(0, 0, 120, 104);
            nextContext.fillStyle = "#111525";
            nextContext.fillRect(0, 0, 120, 104);

            const matrix = PIECES[nextType].shape;
            const size = 23;
            const width = matrix[0].length * size;
            const height = matrix.length * size;
            const offsetX = (120 - width) / 2;
            const offsetY = (104 - height) / 2;

            matrix.forEach((row, rowIndex) => {
                row.forEach((value, colIndex) => {
                    if (value) {
                        nextContext.save();
                        nextContext.translate(offsetX, offsetY);
                        drawCell(
                            nextContext,
                            colIndex,
                            rowIndex,
                            PIECES[nextType].color,
                            size
                        );
                        nextContext.restore();
                    }
                });
            });
        }

        function updateStats() {
            document.querySelector("#score").textContent =
                score.toLocaleString("ko-KR");
            document.querySelector("#lines").textContent = lines;
            document.querySelector("#level").textContent = level;
        }

        function setStatus(type, text) {
            const status = document.querySelector("#status");
            status.className = `panel-card status ${type}`;
            document.querySelector("#status-text").textContent = text;
        }

        function showOverlay(kicker, title, description, buttonText) {
            document.querySelector("#overlay-kicker").textContent = kicker;
            document.querySelector("#overlay-title").textContent = title;
            document.querySelector("#overlay-description").textContent = description;
            document.querySelector("#overlay-button").textContent = buttonText;
            document.querySelector("#game-overlay").classList.add("visible");
        }

        function hideOverlay() {
            document.querySelector("#game-overlay").classList.remove("visible");
        }

        function togglePause() {
            if (gameOver) {
                startGame();
                return;
            }

            paused = !paused;
            document.querySelector("#pause-button").textContent =
                paused ? "계속하기" : "일시정지";

            if (paused) {
                showOverlay(
                    "Game paused",
                    "일시정지",
                    "준비되면 현재 게임을 계속하세요.",
                    "계속하기"
                );
                setStatus("paused", "일시정지");
            } else {
                hideOverlay();
                setStatus("", "플레이 중");
                previousTime = performance.now();
            }
        }

        function endGame() {
            gameOver = true;
            setStatus("over", "게임 종료");
            document.querySelector("#pause-button").textContent = "일시정지";
            showOverlay(
                "Game over",
                "게임 종료",
                `최종 점수 ${score.toLocaleString("ko-KR")}점 · ${lines}줄 제거`,
                "다시 시작"
            );
        }

        function startGame() {
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
            pieceBag = [];
            nextType = takeFromBag();
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 850;
            dropCounter = 0;
            previousTime = performance.now();
            paused = false;
            gameOver = false;

            hideOverlay();
            setStatus("", "플레이 중");
            document.querySelector("#pause-button").textContent = "일시정지";
            spawnPiece();
            updateStats();
            draw();

            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        function gameLoop(time = 0) {
            const delta = time - previousTime;
            previousTime = time;

            if (!paused && !gameOver) {
                dropCounter += delta;
                if (dropCounter >= dropInterval) {
                    softDrop(false);
                }
                draw();
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function performAction(action) {
            const actions = {
                left: () => movePiece(-1),
                right: () => movePiece(1),
                rotate: rotatePiece,
                down: () => softDrop(true),
                drop: hardDrop
            };
            actions[action]?.();
        }

        window.addEventListener("keydown", (event) => {
            const keyActions = {
                ArrowLeft: "left",
                ArrowRight: "right",
                ArrowUp: "rotate",
                ArrowDown: "down",
                " ": "drop"
            };

            if (keyActions[event.key]) {
                event.preventDefault();
                performAction(keyActions[event.key]);
            } else if (event.key.toLowerCase() === "p") {
                event.preventDefault();
                togglePause();
            }
        });

        document.querySelectorAll("[data-action]").forEach((button) => {
            button.addEventListener("pointerdown", (event) => {
                event.preventDefault();
                performAction(button.dataset.action);
            });
        });

        document.querySelector("#restart-button").addEventListener("click", startGame);
        document.querySelector("#pause-button").addEventListener("click", togglePause);
        document.querySelector("#overlay-button").addEventListener("click", () => {
            if (gameOver) {
                startGame();
            } else {
                togglePause();
            }
        });

        startGame();
    </script>
</body>
</html>
