services:
  market-lab:
    build: .
    image: market-lab:local
    ports:
      - "8080:8080"
    environment:
      MOCK_MARKET_DB: /app/data/market.sqlite3
      MOCK_MARKET_ADMIN_KEY: ${MOCK_MARKET_ADMIN_KEY:-}
      FSS_API_KEY: ${FSS_API_KEY:-}
      KRX_API_KEY: ${KRX_API_KEY:-}
      ECOS_API_KEY: ${ECOS_API_KEY:-}
      DART_API_KEY: ${DART_API_KEY:-}
    volumes:
      - market-data:/app/data
    restart: unless-stopped

volumes:
  market-data:
    name: motest-data
    external: true
